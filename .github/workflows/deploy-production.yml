name: deploy-musician-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: musician-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure production backup checkpoint
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json, pathlib
          state = pathlib.Path("backup_2026-07-25/site_files/.ftp_state.json")
          state.parent.mkdir(parents=True, exist_ok=True)
          if not state.exists():
              state.write_text(
                  json.dumps(
                      {
                          "queue": ["/"],
                          "completed": [],
                          "started_utc": "2026-07-27T00:00:00Z",
                      },
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Validate atomic release inputs
        env:
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/verify_artist_release.py
          python tools/validate_seo_update.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import deploy_full_production as deploy

          targets, summary = deploy.read_local_targets()
          if summary["manifest_mismatches"]:
              raise SystemExit(f"Manifest mismatch: {summary['manifest_mismatches']}")
          required = {
              "app/View/catalog/cl01_2/default/index.html",
              "app/View/catalog/cl01_3/default/index.html",
              "app/View/catalog/cl02_4/default/index.html",
              "app/View/catalog/cl02_4/default/view.html",
              "app/webroot/achievements.html",
              "app/webroot/css/style.css",
              "app/webroot/css/works_showcase.css",
              "app/webroot/css/artist_megumi.css",
              "app/webroot/images/company_photo_megumi.jpg",
              "app/webroot/images/company_photo_miyazaki_illustration.jpg",
              "app/webroot/images/works/gallery/traditional-taiko-card.jpg",
          }
          missing = sorted(required - targets.keys())
          if missing:
              raise SystemExit(f"Release targets missing: {missing}")
          print(summary)
          PY

      - name: Deploy to production
        id: deploy
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          set -o pipefail
          python tools/deploy_full_production.py deploy | tee deploy-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path("deploy-result.json").read_text(encoding="utf-8").splitlines()[-1])
          print(f"backup_dir={result['backup_dir']}")
          PY

      - name: Verify deployed production
        run: python tools/verify_seo_production.py

      - name: Roll back a failed production verification
        if: failure() && steps.deploy.outputs.backup_dir != ''
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: python tools/deploy_full_production.py rollback --backup-dir "${{ steps.deploy.outputs.backup_dir }}"

      - name: Remove verified rollback copies and obsolete content
        if: success()
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/deploy_full_production.py cleanup --backup-dir "${{ steps.deploy.outputs.backup_dir }}"
          python tools/deploy_full_production.py purge-remnants

      - name: Preserve rollback snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: musician-production-rollback-${{ github.run_id }}
          path: new_site/production_backups/full_*
          if-no-files-found: warn
          retention-days: 90
