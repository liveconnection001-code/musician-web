name: deploy-musician-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: musician-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ensure production backup checkpoint
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json, pathlib
          state = pathlib.Path("backup_2026-07-25/site_files/.ftp_state.json")
          state.parent.mkdir(parents=True, exist_ok=True)
          if not state.exists():
              state.write_text(
                  json.dumps(
                      {
                          "queue": ["/"],
                          "completed": [],
                          "started_utc": "2026-07-27T00:00:00Z",
                      },
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Validate atomic release inputs
        env:
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/validate_seo_update.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import deploy_full_production as deploy

          targets, summary = deploy.read_local_targets()
          if summary["manifest_mismatches"]:
              raise SystemExit(f"Manifest mismatch: {summary['manifest_mismatches']}")
          required = {
              "app/Controller/AppController.php",
              "app/webroot/release-cache-refresh.php",
              "app/View/catalog/cl01_2/default/index.html",
              "app/View/catalog/cl01_3/default/index.html",
              "app/View/catalog/cl02_4/default/index.html",
              "app/View/catalog/cl02_4/default/view.html",
              "app/webroot/achievements.html",
              "app/webroot/css/style.css",
              "app/webroot/css/works_showcase.css",
              "app/webroot/css/artist_megumi.css",
              "app/webroot/images/company_photo_megumi.jpg",
              "app/webroot/images/company_photo_miyazaki_illustration.jpg",
              "app/webroot/images/works/gallery/traditional-taiko-v2-card.jpg",
          }
          missing = sorted(required - targets.keys())
          if missing:
              raise SystemExit(f"Release targets missing: {missing}")
          print(summary)
          PY

      - name: Deploy to production
        id: deploy
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          set -o pipefail
          python tools/deploy_full_production.py deploy | tee deploy-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path("deploy-result.json").read_text(encoding="utf-8").splitlines()[-1])
          print(f"backup_dir={result['backup_dir']}")
          PY

      - name: Refresh deployed PHP runtime cache
        run: |
          expected_hash="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("new_site/seo_deployment/seo_manifest.json").read_text(encoding="utf-8"))
          entry = next(item for item in manifest["files"] if item["path"] == "app/Controller/AppController.php")
          print(entry["sha256"])
          PY
          )"
          set +e
          http_code="$(curl --silent --show-error --output php-cache-refresh-result.json --write-out '%{http_code}' \
            --connect-timeout 3 --max-time 10 --request POST \
            --header "X-MUSICIAN-RELEASE: ${expected_hash}" \
            https://www.musician.co.jp/release-cache-refresh.php)"
          curl_exit=$?
          set -e
          echo "PHP_CACHE_REFRESH http_status=${http_code:-0} curl_exit=${curl_exit}"
          if [ -s php-cache-refresh-result.json ]; then
            cat php-cache-refresh-result.json
          fi
          # The production verifier remains authoritative. If this transient
          # refresh fails, its GA4 content checks trigger the normal rollback.
          exit 0

      - name: Verify deployed production
        id: verify
        # The verifier has an eight-minute budget.  It distinguishes a bad
        # deployed response from a GitHub runner that cannot reach both the
        # target and an unchanged control resource.
        env:
          MUSICIAN_VERIFY_FETCH_TIMEOUT_SECONDS: "5"
          MUSICIAN_VERIFY_TARGET_MAX_ATTEMPTS: "3"
          MUSICIAN_VERIFY_TARGET_RETRY_DELAY_SECONDS: "15"
          MUSICIAN_VERIFY_BUDGET_SECONDS: "450"
          MUSICIAN_VERIFY_RESULT_PATH: production-verify-result.json
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 8m python tools/verify_seo_production.py
          verify_status=$?
          set -e
          decision="$(python - <<'PY'
          import json
          from pathlib import Path

          result = Path("production-verify-result.json")
          if not result.is_file():
              print("manual_check")
          else:
              print(json.loads(result.read_text(encoding="utf-8")).get("decision", "manual_check"))
          PY
          )"
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          if [ "${decision}" = "manual_check" ]; then
            {
              echo "### 検証未完・手動確認要"
              echo "GitHub runnerから対象URLと対照URLの両方へ通信できませんでした。公開は維持しています。"
              echo "ローカルから、全9ページのHTTP 200と `python tools/verify_seo_production.py` を確認してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${verify_status}"

      - name: Roll back a failed production verification
        if: failure() && steps.verify.outputs.decision == 'rollback' && steps.deploy.outputs.backup_dir != ''
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: python tools/deploy_full_production.py rollback --backup-dir "${{ steps.deploy.outputs.backup_dir }}"

      - name: Remove verified rollback copies and obsolete content
        if: success()
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/deploy_full_production.py cleanup --backup-dir "${{ steps.deploy.outputs.backup_dir }}"
          python tools/deploy_full_production.py purge-remnants

      - name: Preserve rollback snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: musician-production-rollback-${{ github.run_id }}
          path: new_site/production_backups/full_*
          if-no-files-found: warn
          retention-days: 90
