name: deploy-musician-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Snapshot before deploy
      env:
        MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
        MUSICIAN_WORKSPACE: ${{ github.workspace }}
      run: |
        python tools/deploy_full_production.py snapshot

    - name: Deploy to production
      env:
        MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
        MUSICIAN_WORKSPACE: ${{ github.workspace }}
      run: |
        python tools/deploy_full_production.py deploy
