name: deploy-musician-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure production backup checkpoint
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p backup_2026-07-25/site_files
          if [ ! -f backup_2026-07-25/site_files/.ftp_state.json ]; then
            cat > backup_2026-07-25/site_files/.ftp_state.json <<'EOF'
            {
              "queue": ["/"],
              "completed": [],
              "started_utc": "2026-07-27T00:00:00Z"
            }
            EOF
          fi

      - name: Deploy to production
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/deploy_full_production.py deploy
