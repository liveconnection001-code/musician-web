name: deploy-musician-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure production backup checkpoint
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json, pathlib
          state = pathlib.Path("backup_2026-07-25/site_files/.ftp_state.json")
          state.parent.mkdir(parents=True, exist_ok=True)
          if not state.exists():
              state.write_text(
                  json.dumps(
                      {
                          "queue": ["/"],
                          "completed": [],
                          "started_utc": "2026-07-27T00:00:00Z",
                      },
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Deploy to production
        env:
          MUSICIAN_TEMP_FTP_PASSWORD: ${{ secrets.MUSICIAN_TEMP_FTP_PASSWORD }}
          MUSICIAN_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/deploy_full_production.py deploy
